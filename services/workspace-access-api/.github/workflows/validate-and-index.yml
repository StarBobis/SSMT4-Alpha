name: Validate and rebuild workspace indexes

on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'schema/**'
      - 'scripts/**'
      - '.github/workflows/validate-and-index.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  validate-and-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON documents
        run: node scripts/validate-entries.mjs .
      - name: Rebuild indexes
        run: node scripts/build-index.mjs .
      - name: Notify large-package reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/notify-large-entries.mjs .
      - name: Commit generated indexes
        run: |
          if git diff --quiet -- index/v1; then exit 0; fi
          git config user.name 'ssmt-workspace-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index/v1
          git commit -m 'Rebuild workspace indexes [skip ci]'
          git push
